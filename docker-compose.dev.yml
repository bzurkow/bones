name: bones

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bones
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 10

  rustfs:
    # S3-compatible local dev only -- production uses real AWS S3 (S3_ENDPOINT
    # unset there, see backend/src/storage/index.ts). Not LocalStack/MinIO:
    # both archived in 2026 with no mature successor; RustFS is the least-bad
    # current option despite being pre-GA itself -- see NOTES.md.
    image: rustfs/rustfs:v1.0.0-rc.5
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    command: >
      --address :9000
      --console-enable
      --access-key ${AWS_ACCESS_KEY_ID}
      --secret-key ${AWS_SECRET_ACCESS_KEY}
      /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --spider http://localhost:9000/ || exit 0"]
      interval: 2s
      retries: 10

  mailpit:
    # SMTP catcher, local dev only -- production sends through real Amazon
    # SES instead (EMAIL_SMTP_HOST unset there, see backend/src/email/
    # index.ts). Lets email/index.ts's dev transport work with zero real
    # provider credentials; sent mail is readable at the web UI on :8025
    # rather than actually leaving the machine.
    image: axllent/mailpit:v1.20.4
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --spider http://localhost:8025/ || exit 0"]
      interval: 2s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
