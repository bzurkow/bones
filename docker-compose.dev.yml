name: bones

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bones
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 10

  rustfs:
    # S3-compatible local dev only -- production uses real AWS S3 (S3_ENDPOINT
    # unset there, see backend/src/storage/index.ts). Not LocalStack/MinIO:
    # both archived in 2026 with no mature successor; RustFS is the least-bad
    # current option despite being pre-GA itself -- see NOTES.md.
    image: rustfs/rustfs:v1.0.0-rc.5
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    command: >
      --address :9000
      --console-enable
      --access-key ${AWS_ACCESS_KEY_ID}
      --secret-key ${AWS_SECRET_ACCESS_KEY}
      /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --spider http://localhost:9000/ || exit 0"]
      interval: 2s
      retries: 10

  mailpit:
    # SMTP catcher, local dev only -- production sends through real Amazon
    # SES instead (EMAIL_SMTP_HOST unset there, see backend/src/email/
    # index.ts). Lets email/index.ts's dev transport work with zero real
    # provider credentials; sent mail is readable at the web UI on :8025
    # rather than actually leaving the machine.
    image: axllent/mailpit:v1.20.4
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --spider http://localhost:8025/ || exit 0"]
      interval: 2s
      retries: 10

  ollama:
    # Local dev only -- production points CHAT_PROVIDER at real Claude on
    # Amazon Bedrock instead (see backend/src/lib/chat/bedrock-provider.ts).
    # There's no way to point Anthropic's Bedrock SDK at a local model, so
    # dev runs an actual small model (Qwen, OLLAMA_MODEL below) here
    # instead -- ollama-provider.ts talks to its plain HTTP API.
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # The stock image's entrypoint only runs `ollama serve` -- overridden
    # here so first boot also pulls OLLAMA_MODEL once the server's up,
    # rather than requiring a separate manual `docker exec ... ollama pull`
    # step. The pull itself (a multi-GB download, once, cached in the
    # ollama-data volume after) can take a few minutes; ollama-provider.ts
    # simply errors on a chat request until it's done, same as it would
    # for any other "model not ready yet" condition.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 2 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b} && wait"
    healthcheck:
      # Liveness only (the server responding), not "model pulled" -- same
      # `|| exit 0` shape rustfs/mailpit already use above; backend can
      # start against a live-but-still-pulling Ollama the same way it can
      # against rustfs before its buckets exist.
      test: ["CMD-SHELL", "wget -q -O- --spider http://localhost:11434/api/tags || exit 0"]
      interval: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
  ollama-data:
