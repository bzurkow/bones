<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/bones-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/bones-mark-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/bones-app-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bones</title>
    <!-- Description/OG copy intentionally minimal -- the product's actual
         pitch isn't settled yet (see NOTES.md's "Vision"). Don't put a
         specific claim here until it is. -->
    <meta name="description" content="Bones." />

    <!-- og:url/og:image intentionally omitted: they need an absolute
         production URL (per the Open Graph/Twitter Card spec, and most
         scrapers won't resolve a relative one), and there's no real domain
         yet -- add both once one exists, per the "don't hardcode
         local-dev-only values" convention (see NOTES.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bones" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bones" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Sets Mantine's data-mantine-color-scheme attribute synchronously,
         before first paint -- tokens.css's dark-mode block is keyed off
         this attribute. Without it, the page paints with tokens.css's
         default (light) values first, then flashes to the resolved scheme
         once MantineProvider mounts and sets it. This is the plain-HTML
         equivalent of Mantine's own ColorSchemeScript component (which
         assumes a server rendering index.html per request -- doesn't apply
         to a static Vite SPA, so this replicates its exact script inline
         instead). Keep defaultColorScheme / the localStorage key in sync
         with App.tsx's <MantineProvider defaultColorScheme="auto">. -->
    <script>
      try {
        var storedScheme = window.localStorage.getItem("mantine-color-scheme-value");
        var scheme =
          storedScheme === "light" || storedScheme === "dark" || storedScheme === "auto" ? storedScheme : "auto";
        var computedScheme =
          scheme !== "auto" ? scheme : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", computedScheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
